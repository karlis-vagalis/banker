    PaymentStatus:
      type: string
      enum:
        - ACCC
        - ACCP
        - ACSC
        - ACSP
        - ACTC
        - ACWC
        - ACWP
        - PART
        - RCVD
        - PDNG
        - RJCT
        - ACPT
        - ACCR
        - RJCR
        - PACR
        - PDCR
        - CNCL
        - "NULL"
      title: PaymentStatus
      example: ACCC
      x-enum-descriptions:
        - AcceptedCreditSettlementCompleted. Settlement on the creditor's account has
          been completed.
        - AcceptedCustomerProfile. Preceding check of technical validation was successful.
          Customer profile check was also successful.
        - AcceptedCancellationRequest. Cancellation is accepted.
        - Accepted. Request is accepted.
        - AcceptedSettlementCompleted. Settlement on the debtor's account has been completed.
        - AcceptedSettlementInProcess. All preceding checks such as technical validation
          and customer profile were successful. Dynamic risk assessment is now also
          successful and therefore the Payment Request has been accepted for execution.
        - AcceptedTechnicalValidation. Authentication and syntactical and semantical
          validation are successful.
        - AcceptedWithChange. Instruction is accepted but a change will be made, such
          as date or remittance not sent.
        - AcceptedWithoutPosting. Payment instruction included in the credit transfer
          is accepted without being posted to the creditor's account.
        - PaymentCancelled. Payment is cancelled.
        - NoCancellationProcess. There is no cancellation process ongoing.
        - PartiallyAcceptedCancellationRequest. Cancellation is partially accepted.
        - PartiallyAccepted. A number of transactions have been accepted, whereas another
          number of transactions have not yet achieved 'accepted' status.
        - PendingCancellationRequest. Cancellation request is pending.
        - Pending. Payment request or individual transaction included in the Payment
          Request is pending. Further checks and status update will be performed.
        - Received. Payment initiation has been received by the receiving agent.
        - RejectedCancellationRequest. Cancellation request is rejected.
        - Rejected. Payment request  has been rejected.
