          in: header
          required: false
          schema:
            type: string
            description: PSU IP address
            title: Psu-Ip-Address
          description: PSU IP address
        - name: Psu-User-Agent
          in: header
          required: false
          schema:
            type: string
            description: PSU browser User Agent
            title: Psu-User-Agent
          description: PSU browser User Agent
        - name: Psu-Referer
          in: header
          required: false
          schema:
            type: string
            description: PSU Referer
            title: Psu-Referer
          description: PSU Referer
        - name: Psu-Accept
          in: header
          required: false
          schema:
            type: string
            description: PSU accept header
            title: Psu-Accept
          description: PSU accept header
        - name: Psu-Accept-Charset
          in: header
          required: false
          schema:
            type: string
            description: PSU charset
            title: Psu-Accept-Charset
          description: PSU charset
        - name: Psu-Accept-Encoding
          in: header
          required: false
          schema:
            type: string
            description: PSU accept encoding
            title: Psu-Accept-Encoding
          description: PSU accept encoding
        - name: Psu-Accept-language
          in: header
          required: false
          schema:
            type: string
            description: PSU accept language
            title: Psu-Accept-Language
          description: PSU accept language
        - name: Psu-Geo-Location
          in: header
          required: false
          schema:
            type: string
            pattern: -?\d{1,2}\.\d{1,6},-?\d{1,3}\.\d{1,6}
