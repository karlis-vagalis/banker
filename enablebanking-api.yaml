        - "Bonus Payment: Transaction is the payment of a bonus"
        - "Cash Management Transfer: Transaction is a general cash management instruction"
        - "Card Bulk Clearing: A Service that is settling money for a bulk of card transactions,
          while referring to a specific transaction file or other information like terminal
          ID, card acceptor ID or other transaction details"
        - "Credit Card Payment: Transaction is related to a payment of credit card"
        - "Trade Settlement Payment: Transaction is related to settlement of a trade,
          eg a foreign exchange deal or a securities transaction"
        - "Debit Card Payment: Transaction is related to a payment of debit card"
        - "Dividend: Transaction is the payment of dividends"
        - "Deliver Against Payment: Code used to pre-advise the account servicer of
          a forthcoming deliver against payment instruction"
        - "Epayment: Transaction is related to ePayment"
        - "Fee Collection: A Service that is settling card transaction related fees
