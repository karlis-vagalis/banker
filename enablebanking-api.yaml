        - "Irrevocable Debit Card Payment: Transaction is reimbursement of debit card
          payment"
        - "Intra Company Payment: Transaction is an intra-company payment, ie, a payment
          between two companies belonging to the same group"
        - "Interest: Transaction is the payment of interest"
        - "Loan: Transaction is related to the transfer of a loan to a borrower"
        - Commercial Mobile P2B Payment
        - Consumer Mobile P2P Payment
        - "Other Payment: Other payment purpose"
        - "Pension Payment: Transaction is the payment of pension"
        - "Represented: Collection used to re-present previously reversed or returned
          direct debit transactions"
        - "Reimbursement Received Credit Transfer: Transaction is related to a reimbursement
          for commercial reasons of a correctly received credit transfer"
        - "Receive Against Payment: Code used to pre-advise the account servicer of
          a forthcoming receive against payment instruction"
        - "Salary Payment: Transaction is the payment of salaries"
        - "Securities: Transaction is the payment of securities"
        - "Social Security Benefit: Transaction is a social security benefit, ie payment
          made by a government to support individuals"
        - "Supplier Payment: Transaction is related to a payment to a supplier"
        - "Tax Payment: Transaction is the payment of taxes"
        - "Trade: Transaction is related to the payment of a trade finance transaction"
        - "Treasury Payment: Transaction is related to treasury operations.  E.g. financial
          contract settlement"
        - "Value Added Tax Payment: Transaction is the payment of value added tax"
        - "With Holding: Transaction is the payment of withholding tax"
