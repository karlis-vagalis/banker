        pattern:
          title: Pattern
          description: Specifies a regexp pattern for the remittance information line
          type: string
      type: object
      title: RemittanceInformationLineInfo
    RequestedExecutionDate:
      type: string
      format: date
      title: RequestedExecutionDate
      description:
        "Date at which the initiating party requests the clearing agent
        to process the payment.

        API:

        This date can be used in the following cases:

        - the single requested execution date for a payment having several instructions.
        In this case, this field must be set at the payment level.

        - the requested execution date for a given instruction within a payment. In
        this case, this field must be set at each instruction level.

        - The first date of execution for a standing order.

        When the payment cannot be processed at this date, the ASPSP is allowed to
        shift the applied execution date to the next possible execution date for non-standing
        orders.

        For standing orders, the [executionRule] parameter helps to compute the execution
        date to be applied.

        "
    ResponsePaymentType:
      properties:
        payment_type:
          $ref: "#/components/schemas/PaymentType"
          description: Payment type name
        max_transactions:
          title: Max Transactions
          description: Maximum number of transactions per payment
          type: integer
        currencies:
          title: Currencies
          description: List of supported currencies
          items:
            type: string
          type: array
        debtor_account_required:
          type: boolean
          title: Debtor Account Required
          description:
            "States if debtor account is required for payment initiation
            request. When the debtor account is not provided it is to be chosen by
            the PSU during payment authorisation flow. Create payment body field:
            `payment_request.debtor_account`"
          default: false
        debtor_account_schemas:
          title: Debtor Account Schemas
          description: List of supported debtor account schemas
          items:
            $ref: "#/components/schemas/SchemeName"
          type: array
        creditor_account_schemas:
          title: Creditor Account Schemas
          description: List of supported creditor account schemas
          items:
            $ref: "#/components/schemas/SchemeName"
          type: array
        priority_codes:
          title: Priority Codes
          description: List of supported priority codes
          items:
            $ref: "#/components/schemas/PriorityCode"
          type: array
        charge_bearer_values:
          title: Charge Bearer Values
          description: List of supported charge bearer codes
          items:
            $ref: "#/components/schemas/ChargeBearerCode"
          type: array
        creditor_country_required:
          title: Creditor Country Required
          description:
            "States if creditor country is required. Create payment body
            field: `payment_request.credit_transfer_transaction[*].beneficiary.creditor.postal_address.country`"
          default: false
          type: boolean
        creditor_name_required:
          title: Creditor Name Required
          description:
            "States if creditor name is required.  Create payment body
            field: `payment_request.credit_transfer_transaction[*].beneficiary.creditor.postal_address.country`"
          default: false
          type: boolean
        creditor_postal_address_required:
          title: Creditor Postal Address Required
          description:
            "States if creditor postal address is required. Create payment
            body field: `payment_request.credit_transfer_transaction[*].beneficiary.creditor.postal_address`"
          default: false
          type: boolean
        remittance_information_required:
          title: Remittance Information Required
          description:
            "States if remittance information is required. Create payment
            body field: `payment_request.credit_transfer_transaction[*].remittance_information`"
          default: false
          type: boolean
        remittance_information_lines:
          title: Remittance Information Lines
          description:
            Properties of remittance information. Each item of the array
            correspond to the remittance information line with the same index. When
            provided, the number of lines in the remittance information should be
            the same as the length of this array.
          items:
            $ref: "#/components/schemas/RemittanceInformationLineInfo"
          type: array
        debtor_currency_required:
          title: Debtor Currency Required
          description:
            "States if debtor currency is required. Create payment body
            field: `payment_request.debtor_currency`"
          default: false
          type: boolean
        debtor_contact_email_required:
          title: Debtor Contact Email Required
          description:
            "States if debtor's contact email is required when a payment
            this type is being initiated. Create payment body field: `payment_request.debtor.contact_details.email_address`"
          default: false
          type: boolean
        debtor_contact_phone_required:
          title: Debtor Contact Phone Required
          description:
            "States if debtor's contact phone is required when a payment
            this type is being initiated. Create payment body field: `payment_request.debtor.contact_details.phone_number`"
          default: false
          type: boolean
        creditor_agent_bic_fi_required:
          title: Creditor Agent Bic Fi Required
          description:
            "States if creditor agent bicFi is required. Create payment
            body field: `payment_request.credit_transfer_transaction[*].beneficiary.creditor_agent.bic_fi`"
          default: false
          type: boolean
        creditor_agent_clearing_system_member_id_required:
          title: Creditor Agent Clearing System Member Id Required
          description:
            "States if creditor agent clearing system member ID is required.
            Create payment body field: `payment_request.credit_transfer_transaction[*].beneficiary.creditor_agent.clearing_system_member_id`"
          default: false
          type: boolean
        allowed_auth_methods:
          title: Allowed Auth Methods
          description: List of supported auth methods for this payment type
          items:
            type: string
          type: array
        regulatory_reporting_codes:
          title: Regulatory Reporting Codes
          description: List of supported codes for regulatory reporting details
          items:
            $ref: "#/components/schemas/RegulatoryReportingCode"
          type: array
        regulatory_reporting_code_required:
          title: Regulatory Reporting Code Required
          description:
            "States if regulatory reporting shall be provided for credit
            transfer transactions. Create payment body field: `payment_request.credit_transfer_transaction[*].regulatory_reporting.details.code`"
          default: false
          type: boolean
        reference_number_supported:
          title: Reference Number Supported
          description:
            States if reference number can be provided for credit transfer
            transactions
          default: false
          type: boolean
        reference_number_schemas:
          title: Reference Number Schemas
          description: List of reference number schemas supported by a payment method
          items:
            $ref: "#/components/schemas/ReferenceNumberScheme"
          type: array
        requested_execution_date_supported:
          title: Requested Execution Date Supported
          description: States if requested execution date supported by a payment method
          default: false
          type: boolean
        requested_execution_date_max_period:
          title: Requested Execution Date Max Period
          description: Maximum requested execution date interval in the future
          type: integer
        remittance_reference_supported:
          title: Remittance Reference Supported
          description:
            States if both reference number and remittance information
            can be provided simultaneously
          default: false
          type: boolean
        deferred_submission_supported:
          title: Deferred Submission Supported
          description:
            "Indicates whether this payment type supports deferred submission\
            \ for execution. When true, the automatic submission of the payment for\
            \ execution after PSU authorization can be deferred \u2014 the client\
            \ must call POST /payments/{payment_id}/submit to explicitly submit the\
            \ payment for execution."
          default: false
          type: boolean
        final_successful_statuses:
          title: Final Successful Statuses
          description:
            List of the final successful statuses for the payment type.
            Please note that when a payment reaches one of the statuses provided in
            this list, it is not yet guaranteed that the funds will be credited to
            the creditor's account specified in the payment request. It is up to the
            application that created the payment to conclude whether the funds are
            (or will be) received, depending on the actual payment status and other
            factors.
          items:
            $ref: "#/components/schemas/PaymentStatus"
          type: array
        psu_type:
          $ref: "#/components/schemas/PSUType"
          description: PSU type
      type: object
      required:
        - payment_type
        - psu_type
      title: ResponsePaymentType
      example:
        allowed_auth_methods:
          - string
        charge_bearer_values:
          - SLEV
        creditor_account_schemas:
          - IBAN
        creditor_agent_bic_fi_required: false
        creditor_agent_clearing_system_member_id_required: false
        creditor_country_required: false
        creditor_name_required: false
        creditor_postal_address_required: false
        currencies:
          - EUR
        debtor_account_required: false
        debtor_account_schemas:
          - IBAN
        debtor_contact_email_required: false
        debtor_contact_phone_required: false
        debtor_currency_required: false
        max_transactions: 1
        payment_type: SEPA
        priority_codes:
          - NORM
        psu_type: business
        reference_number_schemas:
          - FIRF
          - INTL
        reference_number_supported: true
        regulatory_reporting_code_required: false
        remittance_information_lines:
          - max_length: 140
            min_length: 1
            pattern: ^.{1,140}$
        remittance_information_required: false
        requested_execution_date_max_period: 365
        requested_execution_date_supported: true
    SandboxInfo:
      properties:
        users:
          items:
            $ref: "#/components/schemas/SandboxUser"
          type: array
          title: Users
          description: List of sandbox users which can be used to test sandbox environment
      type: object
      title: SandboxInfo
    SandboxUser:
      properties:
        username:
          title: Username
          description: Username
          examples:
            - MyUsername
          type: string
        password:
          title: Password
          description: Password
          examples:
            - MySecretPassword
          type: string
        otp:
          title: Otp
          description: One time password
          examples:
            - "123456"
          type: string
      type: object
      title: SandboxUser
    SchemeName:
      type: string
      enum:
        - CHID
        - GS1G
        - DUNS
        - BANK
        - TXID
        - CUST
        - EMPL
        - OTHC
        - DRLC
        - CUSI
        - SOSE
        - ARNU
        - CCPT
        - OTHI
        - COID
        - SREN
        - SRET
        - NIDN
        - OAUT
        - CPAN
        - BBAN
        - IBAN
        - MIBN
        - BGNR
        - PGNR
      title: SchemeName
      example: CHID
      x-enum-descriptions:
        - AlienRegistrationNumber
        - BankPartyIdentification. Unique and unambiguous assignment made by a specific
          bank or similar financial institution to identify a relationship as defined
          between the bank and its client.
        - Basic Bank Account Number. Represents a country-specific bank account number.
        - Swedish BankGiro account number. Used in domestic Swedish giro payments
        - PassportNumber
        - Clearing Identification Number
        - CountryIdentificationCode. Country authority given organisation identification
          (e.g., corporate registration number)
        - Card PAN (masked or plain)
        - CustomerIdentificationNumberIndividual. Handelsbanken-specific code
        - CorporateCustomerNumber
        - DriversLicenseNumber
        - Data Universal Numbering System
        - EmployerIdentificationNumber
        - GS1GLNIdentifier
        - International Bank Account Number (IBAN) - identification used internationally
          by financial institutions to uniquely identify the account of a customer.
        - Masked IBAN
        - NationalIdentityNumber. Number assigned by an authority to identify the national
          identity number of a person.
        - OAUTH2 access token that is owned by the PISP being also an AISP and that
          can be used in order to identify the PSU
        - OtherCorporate. Handelsbanken-specific code
        - OtherIndividual. Handelsbanken-specific code
        - Swedish PlusGiro account number. Used in domestic Swedish giro payments
        - SocialSecurityNumber
        - The SIREN number is a 9 digit code assigned by INSEE, the French National
          Institute for Statistics and Economic Studies, to identify an organisation
          in France.
        - The SIRET number is a 14 digit code assigned by INSEE, the French National
          Institute for Statistics and Economic Studies, to identify an organisation
          unit in France. It consists of the SIREN number, followed by a five digit
          classification number, to identify the local geographical unit of that entity.
        - TaxIdentificationNumber
    Service:
      type: string
      enum:
        - AIS
        - PIS
      title: Service
      example: AIS
      x-enum-descriptions:
        - Account Information Service
        - Payment Initiation Service
    ServiceLevelCode:
      type: string
      enum:
        - BKTR
        - G001
        - G002
        - G003
        - G004
        - NUGP
        - NURG
        - PRPT
        - SDVA
        - SEPA
        - SVDE
        - URGP
        - URNS
      title: ServiceLevelCode
      example: BKTR
      x-enum-descriptions:
        - "Book Transaction: Payment through internal book transfer"
        - "Tracked Customer Credit Transfer: Tracked Customer Credit Transfer"
        - "Tracked Stop And Recall: Tracked Stop and Recall"
        - "Tracked Corporate Transfer: Tracked Corporate Transfer"
        - "Tracked Financial Institution Transfer: Tracked Financial Institution Transfer"
        - "Non-urgent Priority Payment: Payment must be executed as a non-urgent transaction
          with priority settlement"
        - "Non-urgent Payment: Payment must be executed as a non-urgent transaction,
          which is typically identified as an ACH or low value transaction"
        - "EBA Priority Service: Transaction must be processed according to the EBA
          Priority Service"
        - "Same Day Value: Payment must be executed with same day value to the creditor"
        - "Single Euro Payments Area: Payment must be executed following the Single
          Euro Payments Area scheme"
        - "Domestic Cheque Clearing and Settlement: Payment execution following the\
          \ cheque agreement and traveller cheque agreement of the German Banking Industry\
          \ Committee (Die Deutsche Kreditwirtschaft - DK) and Deutsche Bundesbank \u2013\
          \ Scheck Verrechnung Deutschland"
        - "Urgent Payment: Payment must be executed as an urgent transaction cleared
          through a real-time gross settlement system, which is typically identified
          as a wire or high value transaction"
        - "Urgent Payment Net Settlement: Payment must be executed as an urgent transaction
          cleared through a real-time net settlement system, which is typically identified
          as a wire or high value transaction"
    SessionAccount:
      properties:
        uid:
          type: string
          format: uuid
          title: Uid
          description: Account identificator within the session
        identification_hash:
          type: string
          title: Identification Hash
          description: Global account identification hash
        identification_hashes:
          items:
            type: string
          type: array
          title: Identification Hashes
          description:
            List of possible account identification hashes. Identification
            hash is based on the account number. Some accounts may have multiple account
            numbers (e.g. IBAN and BBAN). This field contains all possible hashes.
      type: object
      required:
        - uid
        - identification_hash
        - identification_hashes
      title: SessionAccount
    SessionStatus:
      type: string
      enum:
        - INVALID
        - PENDING_AUTHORIZATION
        - RETURNED_FROM_BANK
        - AUTHORIZED
        - EXPIRED
        - CLOSED
        - REVOKED
        - CANCELLED
      title: SessionStatus
      example: INVALID
      x-enum-descriptions:
        - Session is authorised for access to account information
        - Session authorisation has been cancelled by the end-user
        - Session has been closed by the application
        - Session has expired
        - Session authorisation has failed
        - Session authorisation by the end-user is pending
        - Session authorisation has completed successfully by the end-user
        - Session has been revoked by the end-user
    StartAuthorizationRequest:
      properties:
        access:
          $ref: "#/components/schemas/Access"
          description:
            Scope of access to be request from ASPSP and to be confirmed
            by PSU
          examples:
            - valid_until: "2020-12-01T12:00:00.000000+00:00"
        aspsp:
          $ref: "#/components/schemas/ASPSP"
          description: ASPSP that PSU is going to be authenticated to
          examples:
            - country: FI
              name: Nordea
        state:
          type: string
          title: State
          description:
            Arbitrary string. Same string will be returned in query parameter
            when redirecting to the URL passed via redirect_url parameter
          examples:
            - 3a57e2d3-2e0c-4336-af9b-7fa94f0606a3
        redirect_url:
          type: string
          minLength: 1
          format: uri
          title: Redirect Url
          description: URL that PSU will be redirected to after authorization
        psu_type:
          $ref: "#/components/schemas/PSUType"
          description:
            PSU type used for the authorization flow. This parameter affects
            how the authorization is performed at the ASPSP (e.g., whether a personal
            or business login page is shown). A mismatch between the provided psu_type
            and the PSU's actual account type can result in authorization failures
            or the inability to see expected accounts. Since the default value depends
            on the specific connector, it is highly recommended to always provide
            this value for consistent behavior. If the application cannot determine
            the PSU type, it should be requested from the end user (PSU).
        auth_method:
          title: Auth Method
          description:
            Desired authorization method (in case ASPSP integration supports
            multiple). Supported methods can be obtained from the `auth_methods` field
            available in ASPSP details.
          examples:
            - methodName
          type: string
        credentials:
          title: Credentials
          description:
            PSU credentials (e.g., user and/or company ID). If not provided
            through the API, they will be requested from the PSU during authorization.
            Credentials can be supplied only if `auth_method` is specified; otherwise,
            a `WRONG_REQUEST_PARAMETERS` error will be returned.
          examples:
            - userId: MyUsername
          type: object
        credentials_autosubmit:
          type: boolean
          title: Credentials Autosubmit
          description:
            Controls whether user credentials will be autosubmitted (if
            passed). If set to `false` then credentials form will be prefilled with
            passed credentials
          default: true
        language:
          title: Language
          description: Preferred PSU language. Two-letter lowercase language code
          examples:
            - fi
          type: string
          pattern: ^[a-z]{2}$
        psu_id:
          title: Psu Id
          description:
            Unique identification of a PSU used by the client application.
            It can be used to match sessions of the same user. Although only hashed
            value is stored, it is recommended to use anonymised identifiers (i.e.
            digital ID instead of email or social security number). In case the parameter
            is not passed by the application, random value will be used.
          type: string
      type: object
      required:
        - access
        - aspsp
        - state
        - redirect_url
      title: StartAuthorizationRequest
    StartAuthorizationResponse:
      properties:
        url:
          type: string
          minLength: 1
          format: uri
          title: Url
          description: URL to redirect PSU to
          examples:
            - https://auth.enablebanking.com/ais/start?sessionid=73100c65-c54d-46a1-87d1-aa3effde435a
        authorization_id:
          type: string
          format: uuid
          title: Authorization Id
          description:
            PSU authorisation ID, a value used to identify an authorisation
            session. Please note that another session ID will used to fetch account
            data.
          examples:
            - 73100c65-c54d-46a1-87d1-aa3effde435a
        psu_id_hash:
          type: string
          title: Psu Id Hash
          description:
            Hashed unique identification of a PSU used by the client application.
            In case PSU ID is not passed by the client application, the hash is calculated
            based on a random value. The hash also inherits the application ID, so
            different hashes will be calculated when using the same PSU ID with different
            applications.
          examples:
            - 12427b547618d01d46cabfdd6fd7e832bb42076fb210d40e56783e0d1f4798fd
      type: object
      required:
        - url
        - authorization_id
        - psu_id_hash
      title: StartAuthorizationResponse
    StatusReasonInformation:
      properties:
        status_reason_code:
          type: string
          title: Status Reason Code
          description: ISO20022 status reason code
        status_reason_description:
          type: string
          title: Status Reason Description
          description: Status reason description
      type: object
      required:
        - status_reason_code
        - status_reason_description
      title: StatusReasonInformation
    SubmitPaymentResponse:
      properties:
        payment_id:
          type: string
          format: uuid
          title: Payment Id
          description: Payment ID
        status:
          $ref: "#/components/schemas/PaymentStatus"
          description: Current payment status
        final_status:
          type: boolean
          title: Final Status
          description:
            Indicates whether the payment has reached the status expected
            to be final (i.e. if the value of the field is `true`, the payment status
            is not expected to change on later requests)
        status_reason_information:
          description: Additional information about the status reason
          $ref: "#/components/schemas/StatusReasonInformation"
      type: object
      required:
        - payment_id
        - status
        - final_status
      title: SubmitPaymentResponse
    SuccessResponse:
      properties:
        message:
          type: string
          title: Message
          description: Returns "OK" in case of successful request
          default: OK
      type: object
      title: SuccessResponse
    Transaction:
      properties:
        entry_reference:
          title: Entry Reference
          description:
            Unique transaction identifier provided by ASPSP. This identifier
            is both unique and immutable for accounts with the same identification
            hashes and can be used for matching transactions across multiple PSU authentication
            sessions. Usually the same identifier is available for transactions in
            ASPSP's online/mobile interface and is called archive ID or similarly.
            Please note that this identifier is not globally unique and same entry
            references are likely to occur for transactions belonging to different
            accounts.
          examples:
            - "5561990681"
          type: string
        merchant_category_code:
          title: Merchant Category Code
          description:
            Category code conform to ISO 18245, related to the type of
            services or goods the merchant provides for the transaction
          examples:
            - "5511"
          type: string
        transaction_amount:
          $ref: "#/components/schemas/AmountType"
          description: Monetary sum of the transaction
        creditor:
          description: Identification of the party receiving funds in the transaction
          $ref: "#/components/schemas/PartyIdentification"
        creditor_account:
          description: Identification of the account on which the transaction is credited
          examples:
            - iban: FI1737631867613465
          $ref: "#/components/schemas/AccountIdentification"
        creditor_agent:
          description: Identification of the creditor agent
          $ref: "#/components/schemas/FinancialInstitutionIdentification"
        debtor:
          description: Identification of the party sending funds in the transaction
          $ref: "#/components/schemas/PartyIdentification"
        debtor_account:
          description: Identification of the account on which the transaction is debited
          examples:
            - iban: FI8638798819867751
          $ref: "#/components/schemas/AccountIdentification"
        debtor_agent:
          description: Identification of the debtor agent
          $ref: "#/components/schemas/FinancialInstitutionIdentification"
        bank_transaction_code:
          description:
            Allows the account servicer to correctly report a transaction,
            which in its turn will help account holders to perform their cash management
            and reconciliation operations.
          $ref: "#/components/schemas/BankTransactionCode"
        credit_debit_indicator:
          $ref: "#/components/schemas/CreditDebitIndicator"
          description: Accounting flow of the transaction
          examples:
            - CRDT
        status:
          $ref: "#/components/schemas/TransactionStatus"
          description: Available transaction status values
          examples:
            - BOOK
        booking_date:
          title: Booking Date
          description:
            Booking date of the transaction on the account, i.e. the date
            at which the transaction has been recorded on books
          examples:
            - "2020-01-03"
          type: string
          format: date
        value_date:
          title: Value Date
          description:
            Value date of the transaction on the account, i.e. the date
            at which funds become available to the account holder (in case of a credit
            transaction), or cease to be available to the account holder (in case
            of a debit transaction)
          examples:
            - "2020-01-02"
          type: string
          format: date
        transaction_date:
          title: Transaction Date
          description: "Date used for specific purposes:

            - for card transaction: date of the transaction

            - for credit transfer: acquiring date of the transaction

            - for direct debit: receiving date of the transaction"
          examples:
            - "2020-01-01"
          type: string
          format: date
        balance_after_transaction:
          description: Funds on the account after execution of the transaction
          $ref: "#/components/schemas/AmountType"
        reference_number:
          title: Reference Number
          description:
            Credit transfer reference number (also known as the creditor
            reference or the structured creditor reference). The value is set when
            it is known that the transaction data contains a reference number (in
            either ISO 11649 or another format). If the format is known it is provided
            in the reference_number_schema field.
          examples:
            - RF07850352502356628678117
          type: string
        reference_number_schema:
          description: Indicates what kind of reference number is used.
          examples:
            - SDDM
          $ref: "#/components/schemas/ReferenceNumberScheme"
        remittance_information:
          title: Remittance Information
          description:
            Payment details. For credit transfers may contain free text,
            reference number or both at the same time (in case Extended Remittance
            Information is supported). When it is known that remittance information
            contains a reference number (either based on ISO 11649 or a local scheme),
            the reference number is also available via the `reference_number` field.
          examples:
            - - RF07850352502356628678117
              - Gift for Alex
          items:
            type: string
          type: array
        debtor_account_additional_identification:
          title: Debtor Account Additional Identification
          description: All other debtor account identifiers provided by ASPSPs
          examples:
            - identification: "12345678"
              scheme_name: CPAN
          items:
            $ref: "#/components/schemas/GenericIdentification"
          type: array
        creditor_account_additional_identification:
          title: Creditor Account Additional Identification
          description: All other creditor account identifiers provided by ASPSPs
          examples:
            - identification: "12345678"
              scheme_name: BBAN
          items:
            $ref: "#/components/schemas/GenericIdentification"
          type: array
        exchange_rate:
          description: Provides details on the currency exchange rate and contract.
          $ref: "#/components/schemas/ExchangeRate"
        note:
          title: Note
          description: The internal note made by PSU
          type: string
        transaction_id:
          title: Transaction Id
          description:
            Identification used for fetching transaction details.This value
            can not be used to uniquely identify transactions and may change if the
            list of transactions is retrieved again. Null if fetching transaction
            details is not supported.
          type: string
      type: object
      required:
        - transaction_amount
        - credit_debit_indicator
        - status
      title: Transaction
    TransactionStatus:
      type: string
      enum:
        - BOOK
        - CNCL
        - HOLD
        - OTHR
        - PDNG
        - RJCT
        - SCHD
      title: TransactionStatus
      example: BOOK
      x-enum-descriptions:
        - Accounted transaction (ISO20022 Closing Booked)
        - Cancelled transaction
        - Account hold
        - Transaction with unknown status or not fitting the other options
        - Instant Balance Transaction (ISO20022 Expected)
        - Rejected transaction
        - Scheduled transaction
    TransactionsFetchStrategy:
      type: string
      enum:
        - default
        - longest
      title: TransactionsFetchStrategy
      example: default
      x-enum-descriptions:
        - Fetches transactions as requested by the user by passing the `date_from` and
          `date_to` parameters to an ASPSP. If not date_from or date_to is passed, then
          meaningful defaults are used.
        - Tries to find the longest possible period of transactions and fetches transactions
          for that period. Passed date_from is also taken into account. This strategy
          may use extra ASPSP calls. date_to is ignored in this strategy.
