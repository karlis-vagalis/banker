        - (ISO20022 Information) Balance for informational purposes
        - (ISO20022 InterimAvailable) Available balance calculated in the course of
          the day
        - (ISO20022 InterimBooked) Booked balance calculated in the course of the day
        - (ISO20022 OpeningAvailable) Opening balance that is at the disposal of account
          holders at the beginning of the date specified
        - (ISO20022 OpeningBooked) Book balance of the account at the beginning of the
          account reporting period. It always equals the closing book balance from the
          previous report
        - Other Balance
