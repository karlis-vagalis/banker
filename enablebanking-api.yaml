        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description:
            Date to fetch transactions from (including the date, UTC timezone
            is assumed)
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description:
            Date to fetch transactions to (including the date, UTC timezone
            is assumed)
