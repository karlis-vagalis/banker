          required: false
          schema:
            type: string
          description: Key, allowing iterate over multiple API pages of transactions
        - name: transaction_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransactionStatus"
          description: Filter transactions by provided status
        - name: strategy
