    CreatePaymentRequest:
      properties:
        payment_type:
          $ref: "#/components/schemas/PaymentType"
          description: Specifies the type of payment used
        payment_request:
          $ref: "#/components/schemas/PaymentRequestResource"
          description: Specifies the details required to initiate a payment
        aspsp:
          $ref: "#/components/schemas/ASPSP"
          description: ASPSP that PSU is going to be authenticated to
          examples:
            - country: FI
              name: Nordea
        state:
          type: string
          title: State
          description:
            Arbitrary string. Same string will be returned in query parameter
            when redirecting to the URL passed via redirect_url parameter
          examples:
            - 3a57e2d3-2e0c-4336-af9b-7fa94f0606a3
        redirect_url:
          type: string
          minLength: 1
          format: uri
          title: Redirect Url
          description: URL that PSU will be redirected to after authorization
        psu_type:
          $ref: "#/components/schemas/PSUType"
          description:
            PSU type used for the authorization flow. This parameter affects
            how the authorization is performed at the ASPSP (e.g., whether a personal
            or business login page is shown). A mismatch between the provided psu_type
            and the PSU's actual account type can result in authorization failures
            or the inability to see expected accounts. Since the default value depends
            on the specific connector, it is highly recommended to always provide
            this value for consistent behavior. If the application cannot determine
            the PSU type, it should be requested from the end user (PSU).
        auth_method:
          title: Auth Method
          description:
            Desired authorization method (in case ASPSP integration supports
            multiple). Supported methods can be obtained from the `auth_methods` field
            available in ASPSP details.
          type: string
        credentials:
          title: Credentials
          description:
            PSU credentials (e.g., user and/or company ID). If not provided
            through the API, they will be requested from the PSU during authorization.
            Credentials can be supplied only if `auth_method` is specified; otherwise,
            a `WRONG_REQUEST_PARAMETERS` error will be returned.
          examples:
            - userId: MyUsername
          type: object
        language:
          title: Language
          description: Preferred PSU language. Two-letter lowercase language code
          examples:
            - fi
          type: string
          pattern: ^[a-z]{2}$
        webhook_url:
          title: Webhook Url
          description:
            URL that will receive POST requests notifying about payment
            changes. See the [webhooks documentation](../webhooks/index.md#payment-status-webhook)
            for more details
          examples:
            - https://app.com/payment-webhook-handler
          type: string
          minLength: 1
          format: uri
        psu_id:
          title: Psu Id
          description:
            Unique identification of a PSU used by the client application.
            It can be used to match payments of the same user. Although only hashed
            value is stored, it is recommended to use anonymised identifiers (i.e.
            digital ID instead of email or social security number). In case the parameter
            is not passed by the application, random value will be used.
          type: string
        defer_submission:
          type: boolean
          title: Defer Submission
          description:
            "Controls whether the payment submission for execution is deferred
            after PSU authorization. When set to true, the payment will not be automatically
            submitted for execution after PSU completes authorization at the ASPSP.
            Instead, an explicit call to POST /payments/{payment_id}/submit is required
            to submit the payment for execution. Only effective when the selected
            ASPSP payment type has deferred_submission_supported: true. Defaults to
            false."
          default: false
      type: object
      required:
        - payment_type
        - payment_request
        - aspsp
        - state
        - redirect_url
        - psu_type
      title: CreatePaymentRequest
      example:
        aspsp:
          country: FI
          name: S-Pankki
        payment_request:
          credit_transfer_transaction:
            - beneficiary:
                creditor:
                  name: Organisation/Person Name
                creditor_account:
                  identification: FI0455231152453547
                  scheme_name: IBAN
              instructed_amount:
                amount: "10.33"
                currency: EUR
        payment_type: SEPA
        psu_type: personal
        redirect_url: https://google.com/
        state: b463a960-9616-4df6-909f-f80884190c22
    CreatePaymentResponse:
      properties:
        payment_id:
          type: string
          format: uuid
          title: Payment Id
          description: Payment ID
        status:
          $ref: "#/components/schemas/PaymentStatus"
          description: Payment status
        url:
          type: string
          maxLength: 2083
          minLength: 1
