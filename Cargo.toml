[package]
name = "banker"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "CLI for linking bank accounts through Enable Banking and syncing data to local SQLite"
repository = "https://github.com/karlis-vagalis/banker"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
jsonschema = "0.46.10"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
dirs = "6.0.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
progenitor-client = "0.14.0"
regress = "0.11.1"
reqwest = { version = "0.13.4", features = ["json", "rustls", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "json", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
webbrowser = "1.2.1"
indicatif = "0.18.6"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
duration-str = "0.21.0"
sqids = "0.4.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
humantime = "2.4.0"

[build-dependencies]
openapiv3 = "2.2.0"
prettyplease = "0.2.37"
progenitor = "0.14.0"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
syn = { version = "2.0.118", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
